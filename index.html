<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kolin Newby | Software Engineer</title>
    <meta
      name="description"
      content="Kolin Newby is a full-stack software engineer in Denver building performant, reliable, user-focused web applications with React, TypeScript, Go and SQL."
    />
    <link rel="canonical" href="https://kolinnewby.dev/" />

    <link rel="icon" href="/terminal.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e5e7eb" />

    <!-- Link previews. Twitter falls back to the og: tags for the rest. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kolin Newby" />
    <meta property="og:title" content="Kolin Newby | Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack software engineer in Denver building performant, reliable, user-focused web applications."
    />
    <meta property="og:url" content="https://kolinnewby.dev/" />
    <meta property="og:image" content="https://kolinnewby.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kolin Newby, Software Engineer, Denver, CO"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data, so search engines tie the site to its owner's other
         profiles. sameAs mirrors the links in the CMS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://kolinnewby.dev/#website",
            "name": "Kolin Newby",
            "url": "https://kolinnewby.dev/",
            "publisher": { "@id": "https://kolinnewby.dev/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://kolinnewby.dev/#person",
            "name": "Kolin Newby",
            "url": "https://kolinnewby.dev/",
            "jobTitle": "Software Engineer",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Denver",
              "addressRegion": "CO",
              "addressCountry": "US"
            },
            "sameAs": [
              "https://github.com/kolin-newby",
              "https://www.linkedin.com/in/knewby/"
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="no-prin">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Both placeholders are filled in by scripts/prerender.js. -->
    <div id="root"><!--app-html--></div>
    <!--site-data-->

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
